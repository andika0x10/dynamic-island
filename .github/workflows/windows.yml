name: Windows build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match package.json version: v$version"
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:startup
      - run: npm run test:media
      - name: Unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          npm test 2>&1 | Tee-Object -FilePath test-results/unit-tests.txt
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content test-results/unit-tests.txt -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Unit tests::$details"
            exit 1
          }
      - name: Panel UI regression test
        run: npm run test:ui
      - name: Build Windows application
        run: npm run pack
      - name: Package MSIX (signed for releases)
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Andika' }}
          MSIX_TIMESTAMP_URL: ${{ vars.MSIX_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'dynamic-island-signing.pfx'
          try {
            if ($env:MSIX_CERTIFICATE_BASE64) {
              [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
              $env:MSIX_CERTIFICATE_PATH = $certificatePath
            } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
              throw 'Release requires MSIX_CERTIFICATE_BASE64 and MSIX_CERTIFICATE_PASSWORD repository secrets. See docs/DEVELOPMENT.md.'
            }
            ./scripts/package-msix.ps1 -Publisher $env:MSIX_PUBLISHER
          } finally {
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -LiteralPath $certificatePath -Force }
            Remove-Item Env:MSIX_CERTIFICATE_PATH -ErrorAction SilentlyContinue
          }
      - name: Ensure WebView2 Runtime on the CI runner
        shell: pwsh
        run: |
          $runtime = Start-Process -FilePath (Resolve-Path 'release/webview-unpacked/Dynamic Island.exe') -ArgumentList '--ensure-webview' -WindowStyle Hidden -Wait -PassThru
          if ($runtime.ExitCode -ne 0) { throw 'WebView2 Runtime setup failed' }
      - name: WebView2 UI and native integration smoke test
        run: npm run test:smoke -- --packaged
      - name: Enforce small distributions
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msix = Get-Item -LiteralPath "release/Dynamic-Island-$version-x64.msix"
          Write-Host ("MSIX: {0:N2} MB ({1} bytes)" -f ($msix.Length / 1000000), $msix.Length)
          if ($msix.Length -ge 5000000) { throw 'MSIX must be below 5 MB' }
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem release -File | Where-Object Extension -in '.msix', '.cer' | Sort-Object Name)
          if (@($files | Where-Object Extension -eq '.msix').Count -ne 1) { throw 'Expected one MSIX' }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and @($files | Where-Object Extension -eq '.cer').Count -ne 1) { throw 'Expected public signing certificate' }
          $files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: Upload MSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dynamic-island-windows-x64-msix
          path: |
            release/*.msix
            release/*.cer
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: |
            test-results/*.png
            test-results/*.txt
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dynamic-island-windows-x64-msix
          path: release
      - name: Publish MSIX and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_INSTALL_NOTES: |
            ### Instalasi MSIX self-signed
            1. Unduh `DynamicIsland.cer` dan paket `.msix` dari rilis ini.
            2. Buka PowerShell sebagai Administrator di folder unduhan, lalu jalankan:
               `Import-Certificate -FilePath .\DynamicIsland.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople`
            3. Pastikan WebView2 Runtime tersedia, lalu buka MSIX melalui App Installer dan pilih Install.

            Impor sertifikat hanya diperlukan sekali untuk sertifikat yang sama. SHA256SUMS.txt tersedia untuk memeriksa integritas unduhan.
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.msix release/*.cer release/SHA256SUMS.txt --clobber
            while IFS= read -r asset; do
              case "$asset" in
                *.exe|*.zip|*.blockmap|latest.yml) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          else
            args=(--verify-tag --generate-notes --notes "$RELEASE_INSTALL_NOTES" --title "Dynamic Island $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/*.msix release/*.cer release/SHA256SUMS.txt "${args[@]}"
          fi
