name: Windows build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match package.json version: v$version"
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:startup
      - name: Unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          npm test 2>&1 | Tee-Object -FilePath test-results/unit-tests.txt
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content test-results/unit-tests.txt -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Unit tests::$details"
            exit 1
          }
      - name: Panel UI regression test
        run: npm run test:ui
      - name: Build installer
        run: npm run dist:win
      - name: Ensure WebView2 Runtime on the CI runner
        shell: pwsh
        run: |
          $runtime = Start-Process -FilePath (Resolve-Path 'release/webview-unpacked/Dynamic Island.exe') -ArgumentList '--ensure-webview' -WindowStyle Hidden -Wait -PassThru
          if ($runtime.ExitCode -ne 0) { throw 'WebView2 Runtime setup failed' }
      - name: WebView2 UI and native integration smoke test
        run: npm run test:smoke -- --packaged
      - name: Enforce small distributions
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "release/Dynamic-Island-$version-x64-setup.exe"
          Write-Host ("Installer: {0:N2} MB ({1} bytes)" -f ($installer.Length / 1000000), $installer.Length)
          if ($installer.Length -ge 5000000) { throw 'Installer must be below 5 MB' }
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object Extension -eq '.exe' | Sort-Object Name
          if (@($files).Count -ne 1) { throw 'Expected one installer' }
          $files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dynamic-island-windows-x64-installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-screenshots
          path: |
            test-results/*.png
            test-results/*.txt
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: dynamic-island-windows-x64-*
          merge-multiple: true
          path: release
      - name: Publish installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_INSTALL_NOTES: |
            Unduh dan jalankan installer EXE. WebView2 akan dipasang bila diperlukan. Startup otomatis dapat diatur melalui menu tray.

            Untuk berpindah dari paket MSIX lama: uninstall Dynamic Island versi MSIX melalui Settings → Apps terlebih dahulu, lalu pasang installer EXE. Musik, volume, timer, dan baterai tetap tersedia; fitur pembaca notifikasi Windows telah dihapus.
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --notes "$RELEASE_INSTALL_NOTES"
            while IFS= read -r asset; do
              case "$asset" in
                *.msix|*.cer|*.zip|*.blockmap|latest.yml) gh release delete-asset "$RELEASE_TAG" "$asset" --yes ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          else
            args=(--verify-tag --generate-notes --notes "$RELEASE_INSTALL_NOTES" --title "Dynamic Island $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt "${args[@]}"
          fi
